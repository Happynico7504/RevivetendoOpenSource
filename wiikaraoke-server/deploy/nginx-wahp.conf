# Wii Karaoke U: our Inkay fork rewrites the game's base URL to http://wahp.nicoch.net/.
# Only the game API, downloads and the public rankings are exposed. /shop and /admin
# stay local: the shop picks accounts by IP, which is not safe on a public network.
# $eshop_wiiu_client is the map in eshop-wiiu.nicoch.net (relay hub passes the player's IP).
server {
    listen 80;
    server_name wahp.nicoch.net;
    client_max_body_size 1m;

    location ~ ^/(control_Orchestra300_EU\.php$|content/|rankings(/|$)) {
        proxy_pass http://127.0.0.1:8383;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $eshop_wiiu_client;
        proxy_set_header Range $http_range;
        proxy_buffering off;
    }

    location / {
        return 404;
    }
}
